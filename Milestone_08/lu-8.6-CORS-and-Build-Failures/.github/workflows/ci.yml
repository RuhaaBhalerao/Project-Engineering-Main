name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project-Engineering-main/Milestone_08/lu-8.6-CORS-and-Build-Failures
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/linkshelf
      JWT_SECRET: test-secret
      NODE_ENV: production
      CORS_ORIGIN: https://linkshelf-frontend.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Project-Engineering-main/Milestone_08/lu-8.6-CORS-and-Build-Failures/package-lock.json

      - name: Install backend dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project-Engineering-main/Milestone_08/lu-8.6-CORS-and-Build-Failures/frontend
    env:
      VITE_API_URL: https://linkshelf-api.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Project-Engineering-main/Milestone_08/lu-8.6-CORS-and-Build-Failures/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build